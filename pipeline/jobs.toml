# Friendly job names and search aliases (S-003). One table per SOC 2020 4-digit code.
#
# short    everyday name used in headings, lists and the URL. It must describe the same ONS job, not a narrower
#          or wider one; the official ONS name is always shown next to it. Leave it out when the ONS name is
#          already short and plain.
# aliases  words people type for this job. They only help search, so one alias may point at several jobs
#          ("engineer", "nurse"), and search shows them all. Lower case, singular.
#
# Checked on every export: an unknown code, a duplicate short name or slug, or an empty entry stops the export.

