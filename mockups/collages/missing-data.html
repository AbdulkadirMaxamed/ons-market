<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Missing data collages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=block">
<style>
/* Collages 8–11: how missing and estimated figures are labelled and explained.
   Real ONS figures (August 2026 release); reasons paraphrase the workbook's cover sheet and notes. */
*{box-sizing:border-box}
:root{--bg:#eef1f4;--surface:#fff;--surface-2:#f5f7f9;--ink:#0b1220;--ink-2:#3b4659;--ink-3:#566175;--rule:#dbe1e8;
  --line:#0b1220;--fill:rgba(11,18,32,.06);--up:#167a3e;--up-bg:#ddf2e5;--down:#c0262d;--down-bg:#fbe0e1;--missing:#8a94a3;
  --callout:#0b1220;--warn:#8a5a00;--warn-bg:#fff3d6}
body{margin:0;background:#e9eaed;color:#111;font:16px/1.4 "Lexend",system-ui,sans-serif;width:1680px}
.page{padding:44px 48px 56px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;border-bottom:3px solid #111;padding-bottom:18px}
.top h1{margin:0;font:700 38px/1.05 "Lexend";letter-spacing:-.02em}
.top p{margin:6px 0 0;font-size:17px;color:#444;max-width:90ch;font-weight:300}
.top .ask{font:600 17px "Lexend";background:#111;color:#fff;padding:10px 16px;border-radius:999px;white-space:nowrap}
.grid{display:grid;gap:28px 24px}
.item{display:grid;gap:10px;align-content:start}
.frame{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 30px -18px rgba(0,0,0,.45);background:var(--bg)}
.badge{position:absolute;top:10px;left:10px;z-index:9;width:46px;height:46px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font:700 24px "Lexend";box-shadow:0 0 0 3px #fff}
.rec{position:absolute;top:18px;right:14px;z-index:9;background:#167a3e;color:#fff;font:600 13px "Lexend";padding:5px 11px;border-radius:999px}
.cap{display:flex;gap:10px;align-items:baseline}
.cap b{font:600 19px "Lexend";white-space:nowrap}
.cap span{font-size:15px;color:#444;font-weight:300}
.in{padding:72px 18px 18px;display:grid;gap:12px;align-content:start;color:var(--ink);font-weight:300}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.lbl{font:500 12px "Lexend";color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
h4{margin:0 0 8px;font:600 15px "Lexend"}
/* missing labels */
.tag{display:inline-flex;align-items:center;gap:6px;font:500 13px "Lexend";color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--missing);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag svg{flex:none}
.why{font-size:12.5px;line-height:1.4;color:var(--ink-3)}
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);color:var(--ink-3);font:600 11px "Lexend";flex:none}
.ok{color:var(--up);font:600 12.5px "Lexend"} .bad{color:var(--down);font:600 12.5px "Lexend"}
table{border-collapse:collapse;width:100%}
td{padding:8px 4px;border-top:1px solid var(--rule);vertical-align:top;font-size:14px}
.nw td:first-child{white-space:nowrap}
.pop{position:absolute;z-index:6;background:var(--callout);color:#fff;border-radius:10px;padding:12px 14px;font:300 13px/1.45 "Lexend";box-shadow:0 12px 28px -10px rgba(0,0,0,.5)}
.pop b{font-weight:600}
.pop .src{display:block;margin-top:6px;color:#b9c2cf;font-size:11.5px}
.pop:after{content:"";position:absolute;width:12px;height:12px;background:var(--callout);transform:rotate(45deg)}
.pop.up:after{top:-6px;left:var(--ax,30px)}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:3px 10px;font:500 13px "Lexend"}
.chip.down{background:var(--down-bg);color:var(--down)}
.places li{display:grid;grid-template-columns:1fr auto 64px;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px;align-items:center}
.places{list-style:none;margin:0;padding:0}
.places .chg{text-align:right;font-weight:500}
.down{color:var(--down)}
.term{background:#0d1117;color:#d6dde6;border-radius:10px;padding:14px 16px;font:400 12.5px/1.55 "JetBrains Mono",monospace;white-space:pre-wrap}
.term .r{color:#ff8a8f}.term .g{color:#6fdc98}.term .y{color:#f2c230}.term .d{color:#8f9aab}
.file{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font:400 12.5px/1.55 "JetBrains Mono",monospace;white-space:pre-wrap;color:#24292f}
.file .k{color:#0550ae}.file .s{color:#0a3069}.file .c{color:#6e7781}
.foot{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-3)}
sup{font:600 10px "Lexend";color:var(--ink-2)}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
/* ---------- real data ---------- */
// Manchester · SOC 2134 Programmers and software development professionals · quarterly (Table 5), 2023 Q3 – 2026 Q2
const QP = ['Jul–Sep 2023','Oct–Dec 2023','Jan–Mar 2024','Apr–Jun 2024','Jul–Sep 2024','Oct–Dec 2024','Jan–Mar 2025','Apr–Jun 2025','Jul–Sep 2025','Oct–Dec 2025','Jan–Mar 2026','Apr–Jun 2026'];
const QA = ['','','2024','','','','2025','','','','2026',''];
const MANQ = [2138,1515,1511,1150,1008,844,1192,1673,1413,1421,null,1362];
// Cambridge · SOC 213 IT professionals · monthly (Table 4), Sep 2025 – Aug 2026
const MP = ['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
const CAM = [376,400,379,225,396,288,null,375,418,505,365,null];
// Manchester · SOC 213 · monthly (Table 4), Sep 2025 – Aug 2026
const MAN3 = [1219,1239,1780,750,1187,982,null,1246,1402,1269,1303,1541];
const IMPUTED = [false,true,true,true,true,true,false,false,false,false,true,false]; // Oct 2025–Feb 2026, Jul 2026
const fmt = n => n==null ? '–' : n.toLocaleString('en-GB');

/* ---------- reasons (paraphrasing ONS's cover sheet) ---------- */
const R = {
  mar:  {cause:'collected', short:'ONS couldn’t get advert data from a major source this month, so it withheld every figure. It hopes to add March 2026 in a later release.', src:'ONS, Data issue – March 2026'},
  q1:   {cause:'collected', short:'Includes March 2026, when ONS couldn’t get advert data from a major source, so every Jan–Mar 2026 figure was withheld.', src:'ONS, Data issue – March 2026'},
  aug:  {cause:'withheld', short:'Figures swung unusually in August 2026, so ONS withheld the least reliable ones over quality concerns.', src:'ONS, Data issue – August 2026'},
  jun26:{cause:'withheld', short:'A data source dropped out in June and July 2026, so ONS withheld the figures it trusted least.', src:'ONS, Data issue – June and July 2026'},
  next: {cause:'unpublished', short:'ONS hasn’t published Jul–Sep 2026 yet.', src:'ONS release calendar'},
  none: {cause:'notfound', short:'ONS doesn’t publish figures for this job in this place.', src:'ONS Table 5'}
};
const WORDS = {
  A:{collected:'Data not collected', withheld:'Withheld by ONS', unpublished:'Not published yet', notfound:'Not found'},
  B:{collected:'Data not available', withheld:'Data not available', unpublished:'Data not available', notfound:'Data not available'},
  C:{collected:'Data could not be collected', withheld:'Data could not be collected', unpublished:'Data could not be collected', notfound:'Data could not be collected'},
  D:{collected:'Not found', withheld:'Not found', unpublished:'Not found', notfound:'Not found'}
};
// Is the label literally true for that cause?
const TRUE = {
  A:{collected:1,withheld:1,unpublished:1,notfound:1}, B:{collected:1,withheld:1,unpublished:1,notfound:1},
  C:{collected:1,withheld:0,unpublished:0,notfound:0}, D:{collected:0,withheld:0,unpublished:0,notfound:1}
};
const ICON = {collected:'⊘', withheld:'⊘', unpublished:'◷', notfound:'?'};
const tag = (text, cause, extra='') => `<span class="tag"><span aria-hidden="true">${ICON[cause]||'⊘'}</span>${text}${extra}</span>`;
const info = '<span class="i" aria-hidden="true">i</span>';

/* ---------- chart ---------- */
function chart({vals, axis, w=340, h=170, callout=null, est=null, estStyle=null, avg=null}){
  const pl=40, pr=10, pt=12, pb=24, iw=w-pl-pr, ih=h-pt-pb, n=vals.length;
  const max = Math.max(...vals.filter(v=>v!=null), avg||0)*1.12, step = max>2000?1000:max>800?500:200, ymax=Math.ceil(max/step)*step;
  const x=i=>pl+i*iw/(n-1), y=v=>pt+ih-v/ymax*ih, cw=iw/(n-1)*.8;
  const id='p'+Math.random().toString(36).slice(2,7);
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;font-family:Lexend"><defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--missing)" stroke-width="1.6" opacity=".6"/></pattern></defs>`;
  for(let t=0;t<=ymax;t+=ymax/2) s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)"/><text x="${pl-6}" y="${y(t)+4}" font-size="10.5" text-anchor="end" fill="var(--ink-3)">${fmt(t)}</text>`;
  axis.forEach((a,i)=>{ if(a) s+=`<text x="${x(i)}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="var(--ink-3)">${a}</text>`; });
  if (est && estStyle==='band') est.forEach((e,i)=>{ if(e) s+=`<rect x="${x(i)-iw/(n-1)/2}" y="${pt}" width="${iw/(n-1)}" height="${ih}" fill="#f2c230" opacity=".16"/>`; });
  vals.forEach((v,i)=>{ if(v==null) s+=`<rect x="${x(i)-cw/2}" y="${pt}" width="${cw}" height="${ih}" fill="url(#${id})"/>`; });
  if (avg) s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink-3)" stroke-dasharray="5 4"/>`;
  const segs=[];let c=[];vals.forEach((v,i)=>{if(v==null){if(c.length)segs.push(c);c=[]}else c.push(i)});if(c.length)segs.push(c);
  segs.forEach(sg=>{
    const d=sg.map((i,k)=>`${k?'L':'M'}${x(i).toFixed(1)} ${y(vals[i]).toFixed(1)}`).join(' ');
    if(sg.length>1) s+=`<path d="${d} L${x(sg.at(-1))} ${y(0)} L${x(sg[0])} ${y(0)}Z" fill="var(--fill)"/>`;
    if (est && estStyle==='dotted'){
      for(let k=1;k<sg.length;k++){ const a=sg[k-1], b=sg[k], dot = est[a]||est[b];
        s+=`<line x1="${x(a)}" y1="${y(vals[a])}" x2="${x(b)}" y2="${y(vals[b])}" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round" ${dot?'stroke-dasharray="1 5"':''}/>`; }
    } else s+=`<path d="${d}" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(sg.length===1) s+=`<circle cx="${x(sg[0])}" cy="${y(vals[sg[0]])}" r="2.6" fill="var(--line)"/>`;
  });
  if (est && estStyle==='dotted') vals.forEach((v,i)=>{ if(v!=null&&est[i]) s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>`; });
  if (est && estStyle==='est') est.forEach((e,i)=>{ if(e) s+=`<text x="${x(i)}" y="${pt+ih-5}" font-size="10" text-anchor="middle" fill="var(--warn)" font-weight="600">est</text>`; });
  s+='</svg>';
  if (callout){ const cx=x(callout.i); s=`<div style="position:relative">${s}<div class="pop up" style="left:${Math.max(4,Math.min(cx-callout.w/2, w-callout.w-4))}px;top:${h-4}px;width:${callout.w}px;--ax:${cx-Math.max(4,Math.min(cx-callout.w/2,w-callout.w-4))-6}px">${callout.html}</div></div>`; }
  return s;
}

/* ================= COLLAGE 8: label wording ================= */
const ROWS = [
  ['Cambridge · IT professionals','March 2026', R.mar],
  ['Cambridge · IT professionals','August 2026', R.aug],
  ['Manchester · Software developers','Jul–Sep 2026', R.next],
  ['Boston · Company secretaries','Every period', R.none]
];
const wordingTile = k => `<div class="in">
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h4>IT professionals in Cambridge</h4><span class="muted" style="font-size:12.5px">Sep 2025 – Aug 2026</span></div>
    ${chart({vals:CAM, axis:MP.map((m,i)=>i%2===0?m:''), w:690, h:150})}
    <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap"><span style="font-size:13px" class="muted">Gaps:</span>${tag(WORDS[k].collected,'collected',' · Mar')}${tag(WORDS[k].withheld,'withheld',' · Aug')}</div></div>
  <div class="card" style="padding:6px 16px 4px"><table>${ROWS.map(([who,when,r],i)=>`<tr${i===0?' style="border-top:0"':''}>
    <td style="width:210px${i===0?';border-top:0':''}"><div style="font-weight:500">${who}</div><div class="muted" style="font-size:12.5px">${when}</div></td>
    <td style="${i===0?'border-top:0':''}">${tag(WORDS[k][r.cause], r.cause)}<div class="why" style="margin-top:4px">${r.short}</div></td>
    <td style="width:120px;text-align:right${i===0?';border-top:0':''}">${TRUE[k][r.cause]?'<span class="ok">✓ accurate</span>':'<span class="bad">✗ not what ONS says</span>'}</td></tr>`).join('')}</table></div>
</div>`;

/* ================= COLLAGE 9: where the reason shows ================= */
const PLACES = [['London',7421,-22.9],['Manchester',1362,-18.6,true],['Bristol',732,-39.2],['Leeds',664,-41.8],['Birmingham',657,-53.0],['Trafford',null,null]];
function phone(mode){
  // mode: popover | inline | mixed | footnote
  const L = WORDS.A, fn = n => mode==='footnote' ? `<sup>${n}</sup>` : '';
  const helperI = mode==='popover' || mode==='mixed';
  const cardTag = `${tag(L.collected,'collected', mode==='popover'?' '+info:fn(1))}`;
  const cardWhy = (mode==='inline'||mode==='mixed') ? `<div class="why" style="margin-top:6px">${R.q1.short}</div>` : '';
  const calloutHtml = mode==='footnote' ? `<b>${L.collected}</b><sup style="color:#fff">1</sup>` :
     (mode==='popover' ? `<b>Jan–Mar 2026 · ${L.collected}</b> ${info.replace('var(--ink-3)','#fff')}` : `<b>Jan–Mar 2026 · ${L.collected}</b><br>${R.q1.short}`);
  const placeTag = mode==='inline' ? `<div style="grid-column:1/-1;margin-top:-2px" class="why">${R.jun26.short}</div>` : '';
  return `<div class="in" style="padding:68px 12px 14px;gap:10px">
    <div style="font:600 19px Lexend">Software developers in Manchester</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="card" style="padding:12px"><span class="lbl">5-year average</span><div style="font:500 17px Lexend;margin-top:4px" class="down">▼ 44% below</div><div class="muted" style="font-size:12px">Average 2,439 a quarter</div></div>
      <div class="card" style="padding:12px;position:relative"><span class="lbl">Last quarter</span><div style="margin-top:6px">${cardTag}</div>${cardWhy}<div class="muted" style="font-size:12px;margin-top:4px">Jan–Mar 2026</div></div>
    </div>
    ${mode==='popover' ? `<div class="pop up" style="position:relative;margin-top:-2px;--ax:260px"><b>Why there’s no figure</b><br>${R.q1.short}<span class="src">Source: ${R.q1.src}</span></div>` : ''}
    <div class="card" style="padding:12px 8px 12px"><div style="padding:0 6px 4px" class="lbl">Adverts per quarter</div>
      ${chart({vals:MANQ, axis:QA, w:310, h:150, avg:2439, callout:{i:10, w: mode==='inline'||mode==='mixed' ? 230 : 190, html:calloutHtml}})}
      <div style="height:${mode==='inline'||mode==='mixed'?96:mode==='footnote'?42:46}px"></div>
    </div>
    <div class="card" style="padding:4px 12px"><table class="nw">
      <tr><td style="border-top:0">Apr–Jun 2026</td><td style="border-top:0;text-align:right" class="num">1,362</td></tr>
      <tr><td>Jan–Mar 2026</td><td style="text-align:right">${tag(L.collected,'collected', helperI?' '+info:fn(1))}${mode==='inline'?`<div class="why" style="text-align:left;margin-top:4px">${R.q1.short}</div>`:''}</td></tr>
      <tr><td>Oct–Dec 2025</td><td style="text-align:right" class="num">1,421</td></tr></table></div>
    <div class="card" style="padding:4px 12px"><ol class="places">${PLACES.map(([n,v,p,me],i)=>`<li style="${i===0?'border-top:0;':''}${me?'font-weight:500':''}"><span>${n}</span><span class="num">${v==null?tag(L.withheld,'withheld', helperI?' '+info:fn(2)):fmt(v)}</span><span class="chg ${p==null?'muted':'down'}">${p==null?'–':`▼ ${Math.abs(p).toFixed(0)}%`}</span>${v==null?placeTag:''}</li>`).join('')}</ol></div>
    ${mode==='footnote' ? `<div class="card" style="padding:12px;font-size:12.5px;line-height:1.45"><b style="font-weight:600">Why some figures are missing</b><ol style="margin:6px 0 0;padding-left:18px"><li>${R.q1.short}</li><li>${R.jun26.short}</li></ol><span class="foot">Source: ONS cover sheet, data issues</span></div>` : ''}
  </div>`;
}

/* ================= COLLAGE 10: keeping the reasons current ================= */
const yaml = `<span class="c"># pipeline/notices.yaml — one entry per ONS "Data issue" heading</span>
<span class="k">- ons_heading:</span> <span class="s">"Data issue - March 2026"</span>
  <span class="k">months:</span> [<span class="s">2026-03</span>]
  <span class="k">quarters:</span> [<span class="s">2026-Q1</span>]
  <span class="k">label:</span> <span class="s">collected</span>      <span class="c"># → "Data not collected"</span>
  <span class="k">reason:</span> <span class="s">"ONS couldn’t get advert data from a major source…"</span>
<span class="k">- ons_heading:</span> <span class="s">"Data issue - August 2026"</span>
  <span class="k">months:</span> [<span class="s">2026-08</span>]
  <span class="k">label:</span> <span class="s">withheld</span>       <span class="c"># → "Withheld by ONS"</span>
  <span class="k">reason:</span> <span class="s">"Figures swung unusually in August 2026…"</span>`;
const SOURCE = [
  ['Read from the workbook + short labels','Each import saves ONS’s own “Data issue” paragraphs. A small file maps each one to its months and a plain-English label. A new, unmapped issue stops the import.', () => `<div class="in" style="gap:14px">
    <div class="term"><span class="d">$ pnpm data:import data/raw/ons-2026-09.xlsx</span>
<span class="r">Import stopped, database unchanged.</span>
  ONS added a data issue we haven't explained yet:
  <span class="y">"Data issue - September 2026"</span>
  "Users should be aware that we noticed a drop in…"
  Add it to <span class="g">pipeline/notices.yaml</span> and run the import again.</div>
    <div class="file">${yaml}</div>
    <div class="card" style="font-size:13.5px"><b style="font-weight:600">About this data → ONS data issues in this release</b><div class="why" style="margin-top:6px">“The data in March 2026 has been suppressed due to issues encountered when obtaining job advert data from a major source. We are aiming to recover this data…”<br><span style="font-size:11.5px">Quoted from the ONS workbook, published 25 September 2026</span></div></div></div>`],
  ['Hand-written reasons only','The same small file, but nothing checks it against the workbook. Quicker now; a new ONS issue would show a generic reason until someone notices.', () => `<div class="in" style="gap:14px">
    <div class="term"><span class="d">$ pnpm data:import data/raw/ons-2026-09.xlsx</span>
<span class="g">Imported ons-2026-09.xlsx</span>: January 2017 - September 2026
  9,912,004 values read · 101,233 new · 0 revised</div>
    <div class="file">${yaml}</div>
    <div class="card" style="font-size:13.5px"><b style="font-weight:600">On the site, for a new September gap</b><div style="margin-top:8px">${tag('Withheld by ONS','withheld')}</div><div class="why" style="margin-top:6px">ONS withheld this figure over data quality.</div><div class="bad" style="margin-top:6px;font-weight:500">Generic reason until the file is updated by hand</div></div></div>`]
];

/* ================= COLLAGE 11: partly estimated months ================= */
const EST = [
  ['Dotted line','Estimated months drawn dotted with hollow points; legend explains', 'dotted'],
  ['Shaded months','A light amber band behind estimated months; legend explains', 'band'],
  ['“est” under the axis','Line unchanged; a small “est” sits under each estimated month', 'est'],
  ['Not on the chart','Chart unchanged; estimated months only marked in “Show the numbers” and About this data', 'none']
];
const estTile = style => `<div class="in"><div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h4>IT professionals in Manchester · monthly</h4><span class="muted" style="font-size:12.5px">Sep 2025 – Aug 2026</span></div>
  ${chart({vals:MAN3, axis:MP, w:690, h:180, est:style==='none'?null:IMPUTED, estStyle:style})}
  <div style="display:flex;gap:16px;align-items:center;margin-top:8px;font-size:13px;flex-wrap:wrap" class="muted">
    ${style==='dotted'?'<span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" stroke="#0b1220" stroke-width="2.4" stroke-dasharray="1 5" stroke-linecap="round"/></svg> Partly estimated by ONS '+info+'</span>':''}
    ${style==='band'?'<span><span style="display:inline-block;width:16px;height:12px;background:#f2c230;opacity:.35;vertical-align:-1px;border-radius:2px"></span> Partly estimated by ONS '+info+'</span>':''}
    ${style==='est'?'<span><b style="color:var(--warn);font-weight:600">est</b> = partly estimated by ONS '+info+'</span>':''}
    ${style==='none'?'<span>No marks on the chart</span>':''}
    <span><svg width="14" height="12"><rect width="14" height="12" fill="#8a94a3" opacity=".35"/></svg> ${WORDS.A.collected}</span></div>
  ${style==='none'?`<table style="margin-top:8px"><tr><td>Jul 2026</td><td class="num" style="text-align:right">1,303 <span class="tag" style="border-style:solid;border-color:#e3c46a;background:var(--warn-bg);color:var(--warn)">Partly estimated ${info}</span></td></tr></table>`:''}
